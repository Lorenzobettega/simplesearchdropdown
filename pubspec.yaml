name: simple_search_dropdown
description: Searchable single and multi-select dropdowns for Flutter with accent-insensitive search, add/edit/delete of items, keyboard navigation and Material 3 theming.
homepage: https://github.com/Lorenzobettega/simplesearchdropdown
repository: https://github.com/Lorenzobettega/simplesearchdropdown
issue_tracker: https://github.com/Lorenzobettega/simplesearchdropdown/issues
topics:
  - dropdown
  - search
  - autocomplete
  - select
  - widget

screenshots:
  - description: Single selection dropdown open, with the selected item highlighted.
    path: doc/screenshots/single_light.webp
  - description: Accent-insensitive search with custom rows.
    path: doc/screenshots/search_accents.webp
  - description: Multiple selection with chips and the list open.
    path: doc/screenshots/multiple_light.webp
  - description: Delete confirmation dialog naming the item.
    path: doc/screenshots/delete_dialog.webp
  - description: Single selection dropdown in a dark theme.
    path: doc/screenshots/single_dark.webp
  - description: Multiple selection dropdown in a dark theme.
    path: doc/screenshots/multiple_dark.webp

version: 8.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  stringr: ^1.2.2
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
