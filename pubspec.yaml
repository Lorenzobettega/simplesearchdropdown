name: simple_search_dropdown
description: Single and multiple selection dropdowns with search, add/edit/delete of items, keyboard navigation and localizable texts.
homepage: https://github.com/Lorenzobettega/simplesearchdropdown
repository: https://github.com/Lorenzobettega/simplesearchdropdown
issue_tracker: https://github.com/Lorenzobettega/simplesearchdropdown/issues
topics:
  - dropdown
  - search
  - autocomplete
  - select
  - widget

version: 8.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  stringr: ^1.2.2
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
